# LiteLLM proxy configuration — ADR-005
# All LLM calls from Wren go through this proxy.
# Add/remove models here without changing application code.
#
# Usage: automatically loaded by the litellm Docker service.
# Local dev: docker-compose up litellm

model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: claude-sonnet-4
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Enable spend tracking for per-tenant cost visibility (ADR-014)
  store_model_in_db: true
